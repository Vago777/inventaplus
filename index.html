<!DOCTYPE html>
<!-- ============================================================
     Proyecto   : InventaPlus - Sistema de Gestión de Equipos
     Evidencia  : GA7-220501096-AA4-EV03 - Componente front-end
     Vista      : Login (punto de entrada de la aplicación)
     Descripción: Formulario de autenticación del administrador.
                  Valida campos de forma nativa y delega el
                  procesamiento a js/login.js (Fetch API).
     ============================================================ -->
<html lang="es">
<head>
    <!-- Metadatos básicos: codificación UTF-8 y diseño responsivo -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventaPlus - Login</title>

    <!-- Framework CSS Bootstrap 5 desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos propia del login -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Contenedor central de la tarjeta de autenticación -->
    <div class="login-container">

        <!-- Encabezado con identidad del sistema -->
        <div class="logo">
            <h1>InventaPlus</h1>
            <p>Sistema de Gestión de Equipos</p>
        </div>

        <!-- Zonas de retroalimentación (ocultas por defecto vía CSS) -->
        <div class="alert alert-danger" id="errorAlert" role="alert"></div>
        <div class="alert alert-success" id="successAlert" role="alert"></div>

        <!-- Formulario de inicio de sesión con validación HTML5 nativa -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <!-- Botón con spinner que se activa durante la petición -->
            <button type="submit" class="btn btn-primary btn-login">
                <span id="loginText">Iniciar Sesión</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>
    </div>

    <!-- Dependencias JS al final del body para no bloquear el render -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica propia del login (comentarios en js/login.js) -->
    <script src="js/login.js"></script>
</body>
</html>
